<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天気</title>
<style>
body{font-family:sans-serif;margin:0;padding:12px;background:#f3f6fa;color:#222}
#hero{border-radius:14px;padding:18px 16px;margin-bottom:10px;color:#fff;transition:background .6s;box-shadow:0 2px 8px #0002;
 display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-size:clamp(22px,7vw,34px);font-weight:bold;line-height:1.3}
#gr{text-shadow:0 1px 4px #0003}
.row{display:flex;gap:6px;margin-bottom:8px}
input{flex:1;padding:8px;font-size:16px;min-width:0}
button{padding:8px 14px;font-size:15px;white-space:nowrap}
.city,.astro{background:#fff;border-radius:10px;padding:10px;margin:10px 0}
.astro{line-height:1.8;font-size:14px}
.days{display:flex;gap:4px;overflow-x:auto}
.d{min-width:54px;text-align:center;font-size:12px}
.bar{height:60px;display:flex;align-items:flex-end;justify-content:center}
.bar i{display:block;width:22px;background:#4a90e2;border-radius:3px 3px 0 0}
#st{font-size:13px;color:#555}
</style></head><body>
<div id="hero"><span id="dt"></span><span id="gr"></span></div>
<div class="row"><input id="c1" placeholder="地点1"><input id="c2" placeholder="地点2"><button onclick="load()">表示</button></div>
<div id="st"></div><div id="out"></div><div id="astro"></div>
<script>
const W=c=>c==0?["快晴","☀️"]:c<=2?["晴れ時々くもり","🌤️"]:c==3?["くもり","☁️"]:c<=48?["霧","🌫️"]:
c<=57?["霧雨","🌦️"]:c<=67?["雨","🌧️"]:c<=77?["雪","❄️"]:c<=82?["にわか雨","🌦️"]:c<=86?["雪","❄️"]:["雷雨","⛈️"];
const P={"東京":[35.69,139.69],"大阪":[34.69,135.50],"福岡":[33.59,130.40],"札幌":[43.06,141.35],
"仙台":[38.27,140.87],"名古屋":[35.18,136.91],"京都":[35.01,135.77],"神戸":[34.69,135.20],
"横浜":[35.44,139.64],"広島":[34.40,132.46],"那覇":[26.21,127.68],"新潟":[37.92,139.04],
"熊本":[32.80,130.71],"鹿児島":[31.60,130.56],"長崎":[32.75,129.88],"金沢":[36.56,136.66],
"堺":[34.57,135.48],"茨木":[34.82,135.57],"吹田":[34.76,135.52],"豊中":[34.78,135.47],"高槻":[34.85,135.62],"東大阪":[34.68,135.60],"奈良":[34.69,135.80],"岡山":[34.66,133.93],"静岡":[34.98,138.38],"千葉":[35.61,140.12],"さいたま":[35.86,139.65],"川崎":[35.53,139.70]};
let data=[];
const $=id=>document.getElementById(id);
$("c1").value=localStorage.c1||"";$("c2").value=localStorage.c2||"";
/* ---- ヘッダー ---- */
function hero(){
 const d=new Date(),h=d.getHours();
 const g=h<5?["#1b2a4e","#3d2c6e","こんばんは!🌙"]:h<11?["#f6a56b","#f28aa0","おはよう!☀️"]:
  h<16?["#3d7fd6","#7fb8f0","こんにちは!😆"]:h<19?["#f08a5d","#6a5acd","おつかれさま!🌇"]:["#1b2a4e","#3d2c6e","こんばんは!🌙"];
 $("hero").style.background=`linear-gradient(135deg,${g[0]},${g[1]})`;
 $("dt").textContent=`${d.getMonth()+1}月${d.getDate()}日(${"日月火水木金土"[d.getDay()]})`;
 $("gr").textContent=g[2];
}
hero();setInterval(hero,60000);
/* ---- 天気 ---- */
async function geo(n){
 const k=n.replace(/[都府県市]$/,"");
 if(P[k])return{name:n,latitude:P[k][0],longitude:P[k][1]};
 for(const q of["&countryCode=JP&language=ja","&language=ja","&language=en"]){
  try{
   const r=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1"+q+"&name="+encodeURIComponent(n))).json();
   if(r.results&&r.results.length)return r.results[0];
  }catch(e){}
 }
 throw n+"が見つかりません";
}
async function load(){
 $("st").textContent="読み込み中...";
 localStorage.c1=$("c1").value;localStorage.c2=$("c2").value;
 data=[];$("out").innerHTML="";
 const errs=[];
 for(const id of["c1","c2"]){
  const n=$(id).value.trim();if(!n)continue;
  try{
   const g=await geo(n);
   const j=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,daylight_duration&timezone=auto&forecast_days=7`)).json();
   const f=j.daily;
   data.push({name:n,f,lat:g.latitude,lon:g.longitude});
   $("out").innerHTML+=`<div class="city"><b>${n}</b><div class="days">`+
    f.time.map((t,i)=>{const w=W(f.weather_code[i]),p=f.precipitation_probability_max[i]||0;
    return `<div class="d">${t.slice(5).replace("-","/")}<br>${w[1]}<div class="bar"><i style="height:${p*0.6}px"></i></div>${p}%<br>${Math.round(f.temperature_2m_max[i])}/${Math.round(f.temperature_2m_min[i])}°</div>`}).join("")+`</div></div>`;
  }catch(e){errs.push(e)}
 }
 $("st").textContent=errs.length?"エラー: "+errs.join(" / "):"";
 try{astro()}catch(e){$("astro").textContent="天文情報エラー: "+e}
}
/* ---- 天文計算(簡易式。誤差は月の出入り数分、節気は±1日程度) ---- */
const rad=Math.PI/180,D2=x=>((x%360)+360)%360;
const jdOf=t=>t/864e5+2440587.5;
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const T=["春分","清明","穀雨","立夏","小満","芒種","夏至","小暑","大暑","立秋","処暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒","立春","雨水","啓蟄"];
function sunLon(jd){const d=jd-2451545,g=D2(357.528+0.9856003*d)*rad;
 return D2(280.46+0.9856474*d+1.915*Math.sin(g)+0.02*Math.sin(2*g))}
function term(now){
 const idx=t=>Math.floor(sunLon(jdOf(t))/15),day=864e5,c=idx(now);
 let s=now,n=now;
 while(idx(s-day)==c)s-=day;
 while(idx(n)==c)n+=day;
 const f=t=>{const d=new Date(t);return(d.getMonth()+1)+"/"+d.getDate()};
 return `${T[c]}(${f(s)}〜)　次は${T[(c+1)%24]} ${f(n)}`;
}
function moonAlt(t,la,lo){
 const jd=jdOf(t),d=jd-2451545;
 const L=D2(218.316+13.176396*d)*rad,M=D2(134.963+13.064993*d)*rad,F=D2(93.272+13.22935*d)*rad;
 const lon=L+6.289*rad*Math.sin(M),lat=5.128*rad*Math.sin(F),e=23.4397*rad;
 const ra=Math.atan2(Math.sin(lon)*Math.cos(e)-Math.tan(lat)*Math.sin(e),Math.cos(lon));
 const dec=Math.asin(Math.sin(lat)*Math.cos(e)+Math.cos(lat)*Math.sin(e)*Math.sin(lon));
 const H=(280.16+360.9856235*d+lo)*rad-ra,p=la*rad;
 return Math.asin(Math.sin(p)*Math.sin(dec)+Math.cos(p)*Math.cos(dec)*Math.cos(H))/rad-0.133;
}
function moonRS(la,lo){
 const s=new Date();s.setHours(0,0,0,0);
 let r="--:--",st="--:--",pv=moonAlt(+s,la,lo);
 for(let m=5;m<=1440;m+=5){
  const t=+s+m*6e4,a=moonAlt(t,la,lo);
  if(pv<0&&a>=0&&r=="--:--")r=hm(t-5*6e4*a/(a-pv));
  if(pv>=0&&a<0&&st=="--:--")st=hm(t-5*6e4*a/(a-pv));
  pv=a;
 }
 return[r,st];
}
function kep(el,d){
 const N=el[0]+el[1]*d,i=el[2]*rad,w=el[3]+el[4]*d,a=el[5],e=el[6]+el[7]*d,M=D2(el[8]+el[9]*d)*rad;
 let E=M+e*Math.sin(M)*(1+e*Math.cos(M));
 for(let k=0;k<8;k++)E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
 const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E);
 const v=Math.atan2(yv,xv),r=Math.hypot(xv,yv),u=v+w*rad,n=N*rad;
 return{x:r*(Math.cos(n)*Math.cos(u)-Math.sin(n)*Math.sin(u)*Math.cos(i)),
  y:r*(Math.sin(n)*Math.cos(u)+Math.cos(n)*Math.sin(u)*Math.cos(i)),lon:D2(u/rad)};
}
const EL={
 mer:[48.3313,3.24587e-5,7.0047,29.1241,1.01444e-5,0.387098,0.205635,5.59e-10,168.6562,4.0923344368],
 ven:[76.6799,2.4659e-5,3.3946,54.891,1.38374e-5,0.72333,0.006773,-1.302e-9,48.0052,1.6021302244],
 sat:[113.6634,2.3898e-5,2.4886,339.3939,2.97661e-5,9.55475,0.055546,-9.499e-9,316.967,0.0334442282]};
function elong(el,d){
 const s=kep([0,0,0,282.9404,4.70935e-5,1,0.016709,-1.151e-9,356.047,0.9856002585],d),p=kep(el,d);
 let e=D2(Math.atan2(p.y+s.y,p.x+s.x)/rad-s.lon);
 if(e>180)e-=360;return e;
}
function astro(){
 if(!data.length){$("astro").innerHTML="";return}
 const{f,lat,lon,name}=data[0],now=Date.now(),jd=jdOf(now),d=jd-2451543.5;
 let age=(jd-2451550.1)%29.530588853;if(age<0)age+=29.530588853;
 const pi=Math.floor(age/29.530588853*8+0.5)%8;
 const em=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"][pi];
 const pn=["新月","三日月","上弦","満月前","満月","満月後","下弦","有明月"][pi];
 const dl=f.daylight_duration[0],h=Math.floor(dl/3600),m=Math.round(dl%3600/60);
 const[mr,ms]=moonRS(lat,lon);
 const ev=elong(EL.ven,d),es=elong(EL.sat,d),em2=elong(EL.mer,d);
 const A=Math.abs;
 const mer=A(em2)<10?"太陽に近く見えにくい":em2<0?`明けの東空(離角${Math.round(A(em2))}°)`:`宵の西空(離角${Math.round(A(em2))}°)`;
 const ven=A(ev)<10?"太陽に近く見えにくい":ev<0?`明けの明星(離角${Math.round(A(ev))}°)`:`宵の明星(離角${Math.round(A(ev))}°)`;
 const sat=A(es)<25?"太陽に近く見えにくい":es>=100?"見頃(夜遅くまで見える)":es<=-100?"見頃(明け方に高い)":es>0?"宵の空":"明けの空";
 $("astro").innerHTML=`<div class="astro">
 <div style="font-size:12px;color:#666">${name}の天文情報</div>
 ${em} 月齢 ${age.toFixed(1)}(${pn})<br>
 🌾 二十四節気:${term(now)}<br>
 🌅 日の出 ${f.sunrise[0].slice(11,16)} ／ 日の入 ${f.sunset[0].slice(11,16)}(昼 ${h}時間${m}分)<br>
 🌙 月の出 ${mr} ／ 月の入 ${ms}<br>
 🪐 金星 ${ven} ／ 水星 ${mer} ／ 土星 ${sat}</div>`;
}
if($("c1").value||$("c2").value)load();
</script></body></html>
